<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>感情狀態看板</title>
  
  <!-- CSS 框架與圖示 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase 函式庫 -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

  <!-- 獨立樣式檔 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-white min-h-screen flex flex-col items-center p-3 sm:p-6">
  <div id="app" class="w-full max-w-md flex flex-col items-center">

    <!-- 頂部工具列 -->
    <header class="w-full flex items-center justify-between mb-4 px-2">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full" :class="isCloudMode ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'" :title="isCloudMode ? '雲端同步中 (Firebase)' : '本機離線模式 (LocalStorage)'"></span>
        <h1 class="text-lg font-bold tracking-wider text-emerald-100">感情狀態看板</h1>
      </div>
      <div class="flex gap-2">
        <button @click="copyRoomLink" class="bg-emerald-900/60 hover:bg-emerald-800 border border-emerald-600/40 text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1 transition-all">
          <i data-lucide="share-2" class="w-3.5 h-3.5"></i> 分享
        </button>
        <button @click="exportStory" :disabled="isExporting" class="bg-emerald-600 hover:bg-emerald-500 text-xs px-2.5 py-1.5 rounded-lg font-medium flex items-center gap-1 shadow-md transition-all">
          <i data-lucide="download" class="w-3.5 h-3.5"></i> {{ isExporting ? '生成中...' : '匯出限動' }}
        </button>
      </div>
    </header>

    <!-- 月份切換列 -->
    <div class="w-full flex items-center justify-between bg-emerald-950/60 border border-white/10 rounded-xl px-4 py-2.5 mb-4 backdrop-blur-sm">
      <button @click="changeMonth(-1)" class="p-1 hover:bg-white/10 rounded-lg text-emerald-200">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
      <div class="text-center">
        <span class="font-mono text-lg font-bold tracking-widest text-emerald-100">{{ currentMonth }}</span>
        <p v-if="isInherited" class="text-[10px] text-emerald-300/80 -mt-0.5">⚡ 已自動繼承前期狀態</p>
      </div>
      <button @click="changeMonth(1)" class="p-1 hover:bg-white/10 rounded-lg text-emerald-200">
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- 看板主體容器 -->
    <div id="capture-board" class="w-full rounded-2xl p-4 sm:p-5 flex flex-col shadow-2xl relative border border-white/15" style="background-color: var(--board-bg); min-height: 520px;">
      <div class="text-center mb-5">
        <h2 class="font-mono text-2xl font-bold tracking-widest text-emerald-50 drop-shadow-sm">{{ currentMonth }}</h2>
      </div>

      <!-- 四欄狀態看板 -->
      <div class="grid grid-cols-4 gap-1 sm:gap-2 flex-1">
        <div v-for="col in columns" :key="col.id" class="flex flex-col items-center border-r border-white/20 last:border-r-0 px-1">
          <div class="text-center font-medium text-sm sm:text-base text-emerald-100 tracking-wider mb-4 pb-1.5 border-b border-white/20 w-full">
            {{ col.name }}
          </div>

          <div :id="'col-' + col.id" class="kanban-col w-full flex-1 flex flex-col items-center gap-3.5 min-h-[320px]" :data-status="col.id">
            <div 
              v-for="member in getMembersByStatus(col.id)" 
              :key="member.id"
              :data-id="member.id"
              @click="selectedMember = member"
              class="member-card cursor-pointer flex flex-col items-center group relative transition-transform active:scale-95"
            >
              <div class="relative">
                <img 
                  :src="member.avatar || ('https://api.dicebear.com/7.x/bottts/svg?seed=' + encodeURIComponent(member.name))" 
                  class="w-12 h-12 sm:w-14 sm:h-14 rounded-full object-cover border-2 border-white/80 avatar-glow group-hover:border-emerald-300"
                  alt="avatar"
                />
                <span v-if="member.streakMonths > 1" class="absolute -top-1 -right-1 bg-amber-400 text-emerald-950 font-bold text-[9px] px-1.5 py-0.5 rounded-full shadow">
                  {{ member.streakMonths }}M
                </span>
              </div>
              <span class="text-xs text-emerald-100 mt-1.5 max-w-[64px] truncate text-center drop-shadow-sm">{{ member.name }}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="text-center mt-3 pt-2 border-t border-white/10 text-[10px] text-emerald-200/50">
        Status Board • @Friends
      </div>
    </div>

    <!-- 底部操作列：新增成員、匯出/匯入 CSV -->
    <div class="w-full mt-4 flex flex-col gap-2">
      <button @click="showAddModal = true" class="w-full py-2.5 bg-emerald-800/80 hover:bg-emerald-700 border border-emerald-500/30 rounded-xl text-sm font-medium flex items-center justify-center gap-1.5 transition-all">
        <i data-lucide="user-plus" class="w-4 h-4"></i> 新增成員
      </button>

      <div class="flex gap-2 w-full text-xs text-emerald-300/80">
        <button @click="exportData" class="flex-1 py-2 bg-emerald-950/60 hover:bg-emerald-900 border border-white/10 rounded-lg flex items-center justify-center gap-1.5 transition-all">
          <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> 匯出 CSV 資料庫
        </button>
        <label class="flex-1 py-2 bg-emerald-950/60 hover:bg-emerald-900 border border-white/10 rounded-lg flex items-center justify-center gap-1.5 cursor-pointer transition-all">
          <i data-lucide="file-up" class="w-4 h-4"></i> 匯入 CSV
          <input type="file" accept=".csv" class="hidden" @change="importData">
        </label>
      </div>
    </div>

    <!-- 彈窗：調整狀態與頭像 -->
    <div v-if="selectedMember" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-3" @click.self="selectedMember = null">
      <div class="bg-emerald-950 border border-emerald-700/50 rounded-2xl p-5 w-full max-w-xs text-center shadow-2xl flex flex-col items-center">
        <!-- 頭像與更換按鈕 -->
        <div class="relative w-16 h-16 mb-1.5 cursor-pointer group" @click="$refs.editAvatarInput.click()" title="點擊更換照片">
          <img 
            :src="selectedMember.avatar || ('https://api.dicebear.com/7.x/bottts/svg?seed=' + encodeURIComponent(selectedMember.name))" 
            class="w-16 h-16 rounded-full object-cover border-2 border-emerald-400/80 shadow-md group-hover:border-emerald-300 transition-all"
            alt="avatar"
          />
          <div class="absolute inset-0 rounded-full bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity text-white text-[10px] font-medium">
            <span>換照片</span>
          </div>
          <input ref="editAvatarInput" type="file" accept="image/*" class="hidden" @change="onEditAvatarFileChange">
        </div>
        <button @click="$refs.editAvatarInput.click()" class="text-[11px] text-emerald-300/90 hover:text-emerald-200 underline mb-2">
          更換頭像照片
        </button>

        <h3 class="font-bold text-base text-emerald-100 mb-0.5">調整 {{ selectedMember.name }} 的狀態</h3>
        <p class="text-xs text-emerald-400/80 mb-3.5">{{ currentMonth }}</p>
        <div class="grid grid-cols-2 gap-2 mb-4 w-full">
          <button 
            v-for="col in columns" 
            :key="col.id"
            @click="updateStatus(selectedMember.id, col.id)"
            :class="selectedMember.status === col.id ? 'bg-emerald-500 text-emerald-950 font-bold' : 'bg-emerald-900/60 hover:bg-emerald-800 text-emerald-100'"
            class="py-2.5 rounded-xl text-sm border border-emerald-600/30 transition-all"
          >
            {{ col.name }}
          </button>
        </div>
        <button @click="removeMember(selectedMember.id)" class="text-rose-400 hover:text-rose-300 text-xs py-1">
          從房間移除成員
        </button>
      </div>
    </div>

    <!-- 彈窗：新增成員 -->
    <div v-if="showAddModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-3" @click.self="showAddModal = false">
      <div class="bg-emerald-950 border border-emerald-700/50 rounded-2xl p-5 w-full max-w-xs shadow-2xl">
        <h3 class="font-bold text-base text-emerald-100 mb-3 text-center">新增成員</h3>
        <div class="space-y-3 mb-4">
          <div>
            <label class="block text-xs text-emerald-300/80 mb-1">姓名 / 暱稱</label>
            <input v-model="newMember.name" type="text" placeholder="例如：大明" class="w-full bg-emerald-900/60 border border-emerald-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-400">
          </div>
          <div>
            <label class="block text-xs text-emerald-300/80 mb-1">上傳頭像照片</label>
            <input type="file" accept="image/*" @change="onAvatarFileChange" class="w-full text-xs text-emerald-200 file:mr-2 file:py-1 file:px-2.5 file:rounded-md file:border-0 file:text-xs file:bg-emerald-800 file:text-emerald-100 hover:file:bg-emerald-700 cursor-pointer">
            <div v-if="newMember.avatar" class="mt-2 flex items-center gap-2">
              <img :src="newMember.avatar" class="w-8 h-8 rounded-full border border-white/40 object-cover">
              <span class="text-[10px] text-emerald-300">頭像已就緒</span>
            </div>
          </div>
          <div>
            <label class="block text-xs text-emerald-300/80 mb-1">初始狀態</label>
            <select v-model="newMember.status" class="w-full bg-emerald-900/60 border border-emerald-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-400">
              <option v-for="c in columns" :key="c.id" :value="c.id">{{ c.name }}</option>
            </select>
          </div>
        </div>
        <div class="flex gap-2">
          <button @click="showAddModal = false" class="w-1/2 py-2 rounded-lg bg-emerald-900/60 text-emerald-300 text-xs">取消</button>
          <button @click="addMember" class="w-1/2 py-2 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-emerald-950 font-bold text-xs">確認新增</button>
        </div>
      </div>
    </div>

  </div>

  <!-- 按照相依順序載入模組 -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
