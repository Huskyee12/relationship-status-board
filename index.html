<!-- 底部操作列：新增成員、匯出/匯入 CSV -->
    <div class="w-full mt-4 flex flex-col gap-2">
      <button @click="showAddModal = true" class="w-full py-2.5 bg-emerald-800/80 hover:bg-emerald-700 border border-emerald-500/30 rounded-xl text-sm font-medium flex items-center justify-center gap-1.5 transition-all">
        <i data-lucide="user-plus" class="w-4 h-4"></i> 新增成員
      </button>

      <div class="flex gap-2 w-full text-xs text-emerald-300/80">
        <button @click="exportData" class="flex-1 py-1.5 bg-emerald-950/60 hover:bg-emerald-900 border border-white/10 rounded-lg flex items-center justify-center gap-1">
          <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i> 匯出 CSV 資料庫
        </button>
        <label class="flex-1 py-1.5 bg-emerald-950/60 hover:bg-emerald-900 border border-white/10 rounded-lg flex items-center justify-center gap-1 cursor-pointer">
          <i data-lucide="file-up" class="w-3.5 h-3.5"></i> 匯入 CSV
          <input type="file" accept=".csv" class="hidden" @change="importData">
        </label>
      </div>
    </div>

    <!-- 彈窗：新增成員（已完全改為檔案/照片上傳） -->
    <div v-if="showAddModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-3" @click.self="showAddModal = false">
      <div class="bg-emerald-950 border border-emerald-700/50 rounded-2xl p-5 w-full max-w-xs shadow-2xl">
        <h3 class="font-bold text-base text-emerald-100 mb-3 text-center">新增成員</h3>
        <div class="space-y-3 mb-4">
          <div>
            <label class="block text-xs text-emerald-300/80 mb-1">姓名 / 暱稱</label>
            <input v-model="newMember.name" type="text" placeholder="例如：大明" class="w-full bg-emerald-900/60 border border-emerald-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-400">
          </div>
          <div>
            <label class="block text-xs text-emerald-300/80 mb-1">上傳頭像照片</label>
            <input type="file" accept="image/*" @change="onAvatarFileChange" class="w-full text-xs text-emerald-200 file:mr-2 file:py-1 file:px-2.5 file:rounded-md file:border-0 file:text-xs file:bg-emerald-800 file:text-emerald-100 hover:file:bg-emerald-700 cursor-pointer">
            <div v-if="newMember.avatar" class="mt-2 flex items-center gap-2">
              <img :src="newMember.avatar" class="w-8 h-8 rounded-full border border-white/40 object-cover">
              <span class="text-[10px] text-emerald-300">頭像已就緒</span>
            </div>
          </div>
          <div>
            <label class="block text-xs text-emerald-300/80 mb-1">初始狀態</label>
            <select v-model="newMember.status" class="w-full bg-emerald-900/60 border border-emerald-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-400">
              <option v-for="c in columns" :key="c.id" :value="c.id">{{ c.name }}</option>
            </select>
          </div>
        </div>
        <div class="flex gap-2">
          <button @click="showAddModal = false" class="w-1/2 py-2 rounded-lg bg-emerald-900/60 text-emerald-300 text-xs">取消</button>
          <button @click="addMember" class="w-1/2 py-2 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-emerald-950 font-bold text-xs">確認新增</button>
        </div>
      </div>
    </div>
